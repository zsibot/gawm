[project]
name = "gawm"
version = "0.1.0"
description = "A lightweight JEPA-style latent world model grounded in physical states and actions."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "einops==0.8.2",
    "hydra-core==1.3.3",
    "lightning==2.6.5",
    "numpy==2.2.6",
    "omegaconf==2.3.1",
    "scikit-learn==1.7.2",
    "stable-pretraining==0.1.6",
    "stable-worldmodel[env,train]==0.0.6",
    "torch==2.12.0",
    "torchvision==0.27.0",
]

[tool.uv]
package = false

[tool.uv.extra-build-dependencies]
box2d-py = ["swig==4.5.0"]
